version: 2

seeds:
  - name: served_markets
    description: The three markets MoP Cloud sells in. Other countries appear in the data as "not served".
    config:
      column_types: {country_code: text, country_name: text, is_served: boolean, sort_order: integer}
    columns:
      - name: country_code
        data_tests: [unique, not_null]

  - name: priority_levels
    description: Priorities and their response targets (LF-002, option C). The SLA is 8 working hours for all.
    config:
      column_types: {priority: text, priority_label: text, response_target_working_minutes: integer,
                     sla_working_minutes: integer, sort_order: integer}
    columns:
      - name: priority
        data_tests: [unique, not_null]

  - name: priority_rules
    description: The LF-002 rules that set a lead's priority (rule 1 = blocked, handled by review).
    config:
      column_types: {priority_rule: integer, reason_code: text, priority: text, rule_label: text}
    columns:
      - name: priority_rule
        data_tests: [unique, not_null]
      - name: priority
        data_tests:
          - relationships:
              arguments: {to: ref('priority_levels'), field: priority}

  - name: review_reasons
    description: Why a review case was opened, in plain words, and who must act.
    config:
      column_types: {reason_code: text, reason_label: text, action_owner: text, category: text}
    columns:
      - name: reason_code
        data_tests: [unique, not_null]
      - name: action_owner
        data_tests:
          - accepted_values:
              arguments: {values: ['revops', 'sales_manager']}

  - name: kpi_catalog
    description: The KPIs kept in the LF-011 decision sheet (2026-10-29). Definitions in docs/kpi_definitions.md.
    config:
      column_types: {kpi_id: integer, kpi_name: text, section: text, tier: text, unit: text, acts_on_it: text}
    columns:
      - name: kpi_id
        data_tests: [unique, not_null]
      - name: tier
        data_tests:
          - accepted_values:
              arguments: {values: ['Headline', 'Detail']}

  - name: expected_kpis
    description: >
      LF-005 answer key for kpi_summary, generated by tools/expected_kpis.py from
      data/synthetic/expected_outcomes.json. Used only by the test kpi_summary_matches_expected.
    config:
      column_types: {kpi_id: integer, breakdown: text, member: text, numerator: numeric, denominator: numeric}
